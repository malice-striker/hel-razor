<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hel Razor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Georgia, serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.6;
            padding: 20px;
        }

        #splash-container {
            max-width: 680px;
        }

        h1.blink {
            font-size: 2.2rem;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .warning {
            font-size: 1.2rem;
            margin-bottom: 45px;
            max-width: 620px;
            margin-left: auto;
            margin-right: auto;
            color: #eeeeee;
        }

        .entry-link {
            display: inline-block;
            margin-bottom: 40px;
            transition: transform 0.3s ease;
        }

        .entry-link:hover {
            transform: scale(1.06);
        }

        .entry-button {
            max-width: 300px;
            height: auto;
            cursor: pointer;
        }

        .counter {
            margin-top: 30px;
            opacity: 0.8;
        }

        .counter img {
            height: 32px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }

        .blink {
            animation: blink 2s infinite;
        }

        @media (max-width: 600px) {
            h1.blink {
                font-size: 1.85rem;
            }
            
            .warning {
                font-size: 1.1rem;
            }
            
            .entry-button {
                max-width: 260px;
            }
        }
    </style>
</head>
<body>
    <div id="splash-container">
        <h1 class="blink">Must be 18 years or older to enter.</h1>
        
        <p class="warning">
            This website contains content of adult and disturbing natures that some may find too addictive to stop viewing.
        </p>
        
        <a href="home.html" class="entry-link">
            <img src="https://raw.githubusercontent.com/malice-striker/hel-razor/refs/heads/main/media/enter.gif" 
                 alt="Enter" 
                 class="entry-button">
        </a>
        
        <div class="counter">
            <a href="https://www.freecounterstat.com" title="hits counter">
                <img src="https://counter1.optistats.ovh/private/freecounterstat.php?c=dg29jhmqy1b6kd5awrrgbd3cndmb5yq7" 
                     border="0" 
                     title="hits counter" 
                     alt="hits counter">
            </a>
        </div>
    </div>
</body>
</html>
